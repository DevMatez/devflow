name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgres://devflow:devflow@localhost:5432/devflow
  REDIS_URL: redis://localhost:6379
  # Not real secrets — CI never makes live GitHub OAuth calls (fetch is mocked
  # in tests); these only need to satisfy apps/api's env schema.
  GITHUB_OAUTH_CLIENT_ID: ci-test-client-id
  GITHUB_OAUTH_CLIENT_SECRET: ci-test-client-secret
  SESSION_COOKIE_SECRET: ci-test-session-cookie-secret-0123456789ab
  # Not a real secret — valid 32-byte base64 value only to satisfy the env schema
  # and @devflow/integrations-core's parseCredentialsKey() length check.
  INTEGRATION_CREDENTIALS_KEY: 2/cY8CUOzyYqIfOq051qlbdzZ2L7wwDXo5jyioBuBgk=
  # Not a real GitHub App — a throwaway RSA key only to satisfy the env schema
  # and let @octokit/auth-app sign a JWT client-side (no live GitHub calls in tests).
  GITHUB_APP_ID: 999999
  GITHUB_APP_PRIVATE_KEY_BASE64: 
  GITHUB_APP_WEBHOOK_SECRET: ci-test-github-app-webhook-secret
  GITHUB_APP_SLUG: devflow-ci-test
  # Not real secrets — CI never makes live Slack calls (fetch is mocked in tests).
  SLACK_CLIENT_ID: ci-test-slack-client-id
  SLACK_CLIENT_SECRET: ci-test-slack-client-secret
  SLACK_SIGNING_SECRET: ci-test-slack-signing-secret
  SLACK_OAUTH_CALLBACK_URL: http://localhost:4000/api/v1/integrations/slack/callback

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devflow
          POSTGRES_PASSWORD: devflow
          POSTGRES_DB: devflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint --ui=stream

      - name: Typecheck
        run: pnpm turbo run typecheck --ui=stream

      - name: Test
        run: pnpm turbo run test --ui=stream

      - name: Build
        run: pnpm turbo run build --ui=stream
