name: Hourly GitLab MR check

# Runs on GitHub's servers (public repo = free unlimited minutes).
# Works when your laptop is shut down.
# Manual test: Actions tab -> "Hourly GitLab MR check" -> Run workflow.
on:
  schedule:
    - cron: "0 * * * *" # every hour (UTC)
  workflow_dispatch: # manual trigger for testing

jobs:
  mr-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # bound cost per run; agent prompt also caps scope
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          # OpenCode Zen key (Muse Spark). Get it at opencode.ai/auth,
          # add as OPENCODE_API_KEY in repo Settings -> Secrets -> Actions.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GitLab token (api scope) for reading/replying to MRs and
          # pushing fix commits. Add in repo Settings -> Secrets -> Actions.
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        with:
          model: opencode/muse-spark-1.3-contributor-free
          use_github_token: true # no GitHub App install needed
          prompt: |
            Hourly GitLab MR review. Act autonomously — no human will approve
            anything, so never wait for confirmation. Never merge anything;
            only push fixes and replies. Keep the whole run under ~15 minutes.

            1. If GITLAB_TOKEN is missing/empty, log a clear error and stop.
            2. List MRs assigned to me:
               curl -s -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
                 "https://gitlab.com/api/v4/merge_requests?scope=assigned_to_me&state=opened&per_page=10"
            3. For each MR (max 3, most recently updated first):
               - GET /projects/:id/merge_requests/:iid/discussions and keep
                 only unresolved notes that request a change or ask a question.
               - If a code fix is requested AND the project allows push with
                 GITLAB_TOKEN: shallow-clone the MR branch to /tmp, apply a
                 minimal scoped fix, run the fastest relevant check only
                 (lint/typecheck, never full e2e), commit and push to the MR
                 branch, then resolve the discussion and reply via the API.
               - If it is a question: reply via the API without code changes.
               - If you cannot push (no access): summarize exactly what needs
                 a human in the run log.
            4. Log a summary: MRs checked, fixes pushed, items needing a human.
