name: Hourly GitLab MR check

# Runs on GitHub's servers (public repo = free unlimited minutes).
# Works when your laptop is shut down.
# Manual test: Actions tab -> "Hourly GitLab MR check" -> Run workflow.
on:
  schedule:
    - cron: "0 * * * *" # every hour (UTC)
  workflow_dispatch: # manual trigger for testing

jobs:
  mr-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # bound cost per run; agent prompt also caps scope
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          # OpenCode Zen key (Muse Spark). Get it at opencode.ai/auth,
          # add as OPENCODE_API_KEY in repo Settings -> Secrets -> Actions.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GitLab token (api scope) for reading/replying to MRs and
          # pushing fix commits. Add in repo Settings -> Secrets -> Actions.
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        with:
          model: opencode/muse-spark-1.3-contributor-free
          use_github_token: true # no GitHub App install needed
          prompt: |
            Hourly GitLab assistant for user arjun40779. Act autonomously —
            no human will approve anything, so never wait for confirmation.
            Never merge anything under any circumstance. Keep the whole run
            under ~15 minutes.

            Resolve my numeric user ID once: GET /user with the token.

            PART A — reactive sweep (every run): my open MRs.
            1. If GITLAB_TOKEN is missing/empty, log a clear error and stop.
            2. List open MRs where I am assignee (scope=assigned_to_me) AND
               open MRs I authored (author_id=<my id>). Merge both lists,
               dedupe by MR id, process max 3 most recently updated first.
            3. For each MR: GET /projects/:id/merge_requests/:iid/discussions
               and keep only notes with resolvable=true, resolved=false,
               not system/activity notes. Unresolved reviewer change-requests
               and questions are "new activity" — that filter IS the new-
               activity detection (resolved threads need no action).
               - Code fix requested: determine the push target first — if the
                 MR's source project differs from its target project (fork
                 workflow), clone and push the SOURCE (fork) project/branch,
                 which you own. If same project, verify push access via
                 members/all/<my id> (access_level >= 30) before cloning.
                 Then: shallow-clone to /tmp, apply a minimal scoped fix, run
                 the fastest relevant check only (lint/typecheck, never full
                 e2e), commit and push, resolve the discussion and reply via
                 the API.
               - Question only: reply via the API, no code changes.
               - Cannot push: note exactly what a human must do in the log.

            PART B — proactive quick grabs (strictly guardrailed, usually a
            no-op check taking seconds):
            1. List MY open MRs whose source_branch starts with `bot/`. If
               one already exists, an autonomous MR is still in flight — skip
               the rest of Part B entirely (max ONE open autonomous MR).
            2. Otherwise look for exactly ONE candidate, in this order:
               a) an open issue assigned to me that looks small and
                  self-contained; b) an issue labeled `quick win` or
               `good first issue` in a project where I am a member.
               Skip anything touching >5 files, migrations, auth/security,
               or needing product decisions. If nothing qualifies, stop.
            3. Determine where to push: if members/all/<my id> shows
               access_level >= 30, push to the project itself. Else look for
               an existing fork you own (GET /projects/:id/forks?owned=true,
               or match forked_from_project.id == :id in your project list).
               If a fork exists, push the `bot/` branch there and open the MR
               fork → upstream. If NO fork exists, do NOT create one
               unsolicited — log the candidate as "needs human (no push
               access, no fork)" and stop.
            4. Implement with a test where the project has a test setup, run
               the fastest relevant check, push branch `bot/<issue-iid>-<slug>`
               to the target from step 3, and open the MR with title prefix
               `[bot]` and a description that discloses it was raised
               autonomously, links the issue, notes the fork source when
               applicable, and asks for human review. Do NOT wait for the
               pipeline — later hourly runs pick the MR up via Part A (author
               scope) and fix any pipeline failures then.

            PART C — run log summary (always): MRs checked (A), fixes pushed,
            replies posted, proactive candidate attempted or reason skipped,
            items needing a human. Merges: always 0.
